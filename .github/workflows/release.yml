name: release

# Cut a release by pushing a tag: `git tag vX.Y.Z && git push origin vX.Y.Z`.
# CI builds the wasm, packs it as an npm tarball, and creates a GitHub
# Release with auto-generated changelog notes (see docs/RELEASE.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build wasm
        run: wasm-pack build --target web --release --out-dir pkg --features wasm

      - name: Pack npm tarball
        run: |
          npm pack ./pkg
          ls -lh *.tgz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # GitHub's free auto-generated changelog (conventional-commit aware).
          generate_release_notes: true
          files: wordle-solver-*.tgz